<text x="1150" y="545" class="label">Verify payment</text><text x="1150" y="569" class="small">Signature → mark paid → add credits</text>

<rect x="1115" y="605" width="430" height="230" rx="28" fill="#fefce8" stroke="#eab308" class="box" filter="url(#shadow)"/>
<text x="1330" y="645" text-anchor="middle" class="head">Browser Services</text>
<text x="1150" y="690" class="label">Web Speech API</text><text x="1150" y="714" class="small">Speech Recognition + Speech Synthesis</text>
<text x="1150" y="748" class="label">Local report generation</text><text x="1150" y="772" class="small">jsPDF + AutoTable</text>
<text x="1150" y="806" class="tiny">Voice support depends on browser permissions/capabilities</text>

<!-- Arrows -->
<path d="M485 475 H575" class="line"/><text x="530" y="455" text-anchor="middle" class="tiny">Axios / JSON</text>
<path d="M1025 250 H1105" class="line"/><text x="1065" y="230" text-anchor="middle" class="tiny">AI requests</text>
<path d="M1105 285 H1025" class="line"/><text x="1065" y="310" text-anchor="middle" class="tiny">Questions / feedback</text>
