<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#334155"/></marker>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#0f172a}.sub{font:400 18px Arial,sans-serif;fill:#64748b}
    .head{font:700 23px Arial,sans-serif;fill:#0f172a}.label{font:700 17px Arial,sans-serif;fill:#111827}
    .small{font:400 15px Arial,sans-serif;fill:#475569}.tiny{font:400 13px Arial,sans-serif;fill:#64748b}
    .box{stroke-width:2}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="950" fill="url(#bg)"/>
<text x="800" y="55" text-anchor="middle" class="title">InterviewIQ.AI — System Architecture</text>
<text x="800" y="84" text-anchor="middle" class="sub">React + Node.js + MongoDB + AI + Payments</text>

<!-- Client -->
<rect x="55" y="125" width="430" height="710" rx="28" fill="#eff6ff" stroke="#60a5fa" class="box" filter="url(#shadow)"/>
<text x="270" y="165" text-anchor="middle" class="head">Client / Frontend</text>
<text x="270" y="192" text-anchor="middle" class="small">React • Vite • Tailwind CSS • Redux Toolkit</text>
<rect x="85" y="220" width="370" height="82" rx="18" fill="#fff"/>
<text x="105" y="250" class="label">Authentication</text><text x="105" y="275" class="small">Google Sign-In • JWT Cookie Session</text>
<rect x="85" y="322" width="370" height="92" rx="18" fill="#fff"/>
<text x="105" y="352" class="label">Interview Setup</text><text x="105" y="377" class="small">Role • Experience • HR / Technical</text><text x="105" y="397" class="tiny">Resume PDF upload</text>
<rect x="85" y="434" width="370" height="112" rx="18" fill="#fff"/>
<text x="105" y="464" class="label">Live Interview Room</text><text x="105" y="490" class="small">AI voice • speech recognition</text><text x="105" y="512" class="small">Timer • interviewer video</text>
<rect x="85" y="566" width="370" height="92" rx="18" fill="#fff"/>
<text x="105" y="596" class="label">Reports & Analytics</text><text x="105" y="621" class="small">Scores • graphs • question feedback</text>
<rect x="85" y="678" width="370" height="112" rx="18" fill="#fff"/>
<text x="105" y="708" class="label">Pricing & History</text><text x="105" y="733" class="small">Credits • Razorpay checkout</text><text x="105" y="755" class="small">Past interviews • PDF export</text>

<!-- Backend -->
<rect x="585" y="125" width="430" height="710" rx="28" fill="#f0fdf4" stroke="#4ade80" class="box" filter="url(#shadow)"/>
<text x="800" y="165" text-anchor="middle" class="head">Backend / API</text>
<text x="800" y="192" text-anchor="middle" class="small">Node.js • Express.js • REST API</text>
<rect x="615" y="220" width="370" height="78" rx="18" fill="#fff"/>
<text x="635" y="250" class="label">Auth & Authorization</text><text x="635" y="275" class="small">JWT verification • protected routes</text>
<rect x="615" y="318" width="370" height="98" rx="18" fill="#fff"/>
<text x="635" y="348" class="label">Interview Controller</text><text x="635" y="373" class="small">Resume parsing • question generation</text><text x="635" y="395" class="small">Answer evaluation • final report</text>
<rect x="615" y="436" width="370" height="78" rx="18" fill="#fff"/>
<text x="635" y="466" class="label">AI Service</text><text x="635" y="491" class="small">OpenRouter API integration</text>
<rect x="615" y="534" width="370" height="92" rx="18" fill="#fff"/>
<text x="635" y="564" class="label">Payment Service</text><text x="635" y="589" class="small">Razorpay order + signature verification</text>
<rect x="615" y="646" width="370" height="92" rx="18" fill="#fff"/>
<text x="635" y="676" class="label">Data & File Handling</text><text x="635" y="701" class="small">Mongoose • PDF.js • Multer</text>

<!-- DB -->
<rect x="585" y="855" width="430" height="65" rx="20" fill="#ecfeff" stroke="#22d3ee" class="box"/>
<text x="800" y="883" text-anchor="middle" class="label">MongoDB Atlas</text>
<text x="800" y="906" text-anchor="middle" class="tiny">Users • Interviews • Payments • Scores • History</text>

