<text x="1330" y="165" text-anchor="middle" class="head">AI Service</text>
<text x="1330" y="192" text-anchor="middle" class="small">OpenRouter → OpenAI GPT-4o-mini</text>
<text x="1150" y="235" class="label">Resume understanding</text><text x="1150" y="259" class="small">Extract role, experience, projects, skills</text>
<text x="1150" y="295" class="label">Interview intelligence</text><text x="1150" y="319" class="small">Generate questions • evaluate answers</text>

<rect x="1115" y="385" width="430" height="190" rx="28" fill="#fff7ed" stroke="#fb923c" class="box" filter="url(#shadow)"/>
