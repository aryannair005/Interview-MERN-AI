<!-- browser services arrows -->
<path d="M1115 720 H1025" class="line"/><text x="1070" y="700" text-anchor="middle" class="tiny">Voice / PDF</text>

<text x="800" y="942" text-anchor="middle" class="tiny">High-level architecture based on the current repository structure</text>
